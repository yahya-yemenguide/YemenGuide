name: Fix customer-request cancellation

on:
  push:
    branches: [fix-customer-request-cancellation]

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-customer-request-cancellation

      - name: Apply patch
        shell: pwsh
        run: python .github/scripts/patch_customer_request_cancellation.py

      - name: Verify JavaScript
        shell: pwsh
        run: node --check YemenGuide.Web/wwwroot/js/owner/reservation-actions.js

      - name: Verify diff
        shell: pwsh
        run: git diff --check

      - name: Build solution
        shell: pwsh
        run: dotnet build YemenGuide.sln --configuration Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact\YemenGuide.Web\Areas\Owner\Controllers | Out-Null
          New-Item -ItemType Directory -Force -Path artifact\YemenGuide.Web\wwwroot\js\owner | Out-Null
          New-Item -ItemType Directory -Force -Path artifact\YemenGuide.Web\Controllers | Out-Null
          Copy-Item YemenGuide.Web\Areas\Owner\Controllers\ReservationController.CustomerCancellation.cs artifact\YemenGuide.Web\Areas\Owner\Controllers\
          Copy-Item YemenGuide.Web\wwwroot\js\owner\reservation-actions.js artifact\YemenGuide.Web\wwwroot\js\owner\
          Copy-Item YemenGuide.Web\Controllers\BookingsController.cs artifact\YemenGuide.Web\Controllers\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-request-cancellation-fix
          path: artifact

      - name: Remove temporary helper files
        shell: pwsh
        run: |
          Remove-Item .github\scripts\patch_customer_request_cancellation.py
          Remove-Item .github\workflows\fix-customer-request-cancellation.yml

      - name: Commit verified changes
        shell: pwsh
        run: |
          git config user.name "yahya-yemenguide"
          git config user.email "yahyagemini11@gmail.com"
          git add -A
          git commit -m "إضافة إلغاء بطلب العميل حسب سياسة المنشأة"
          git push origin fix-customer-request-cancellation
