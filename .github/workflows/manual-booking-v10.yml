name: Manual Booking V10

on:
  push:
    branches:
      - manual-booking-v10-fixes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manual-booking-v10-fixes
          fetch-depth: 0

      - name: Apply targeted patches
        run: |
          python3 tools/manual-booking-v10/patch_dto.py
          python3 tools/manual-booking-v10/patch_controller_1.py
          python3 tools/manual-booking-v10/patch_controller_2.py
          python3 tools/manual-booking-v10/patch_view.py
          python3 tools/manual-booking-v10/patch_js_1.py
          python3 tools/manual-booking-v10/patch_js_2.py
          python3 tools/manual-booking-v10/patch_js_3.py

      - name: Verify changes
        run: |
          grep -q 'const decimal platformCommission = 0m' YemenGuide.Web/Areas/Owner/Controllers/ReservationController.Calendar.cs
          grep -q 'OwnerWalletId' YemenGuide.Core/DTOs/Owner/OwnerCalendarDtos.cs
          grep -q 'ygManualOwnerWalletId' YemenGuide.Web/Areas/Owner/Views/Reservation/_CalendarManager.cshtml
          grep -q 'syncGuestCapacity' YemenGuide.Web/wwwroot/js/owner/calendar-manager.js
          node --check YemenGuide.Web/wwwroot/js/owner/calendar-manager.js
          git diff --check

      - name: Build solution
        run: dotnet build YemenGuide.sln --configuration Release --nologo

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add YemenGuide.Core/DTOs/Owner/OwnerCalendarDtos.cs \
                  YemenGuide.Web/Areas/Owner/Controllers/ReservationController.Calendar.cs \
                  YemenGuide.Web/Areas/Owner/Views/Reservation/_CalendarManager.cshtml \
                  YemenGuide.Web/wwwroot/js/owner/calendar-manager.js
          git commit -m 'ضبط الحجز اليدوي والعربون والمحافظ وإعفاء العمولة'
          git push origin HEAD:manual-booking-v10-fixes
