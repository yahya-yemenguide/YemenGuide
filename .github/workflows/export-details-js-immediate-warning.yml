name: Export immediate warning replacement file

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - shell: bash
        run: |
          ROOT="YemenGuide_IMMEDIATE_STARTED_WARNING_FIX"
          mkdir -p "$ROOT/YemenGuide.Web/wwwroot/js/customer"
          cp YemenGuide.Web/wwwroot/js/customer/Details.js "$ROOT/YemenGuide.Web/wwwroot/js/customer/Details.js"
          cat > "$ROOT/اقرأني.txt" <<'TXT'
          إصلاح التنبيه الفوري عند اختيار اليوم
          ====================================
          استبدل ملفًا واحدًا فقط:
          YemenGuide.Web/wwwroot/js/customer/Details.js

          عند اختيار اليوم من التقويم يتم التحقق فورًا:
          - إذا كانت الفترة بدأت وما زالت مستمرة تظهر الرسالة مباشرة.
          - توضح كم مضى وكم بقي.
          - إذا وافق العميل يبقى اليوم محددًا ويتفعل زر التالي.
          - إذا رفض يتم إلغاء اختيار اليوم.
          - لا يتكرر التنبيه لنفس الباقة ونفس اليوم بعد موافقة العميل.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: YemenGuide_IMMEDIATE_STARTED_WARNING_FIX
          path: YemenGuide_IMMEDIATE_STARTED_WARNING_FIX
          retention-days: 7
