name: Fix manual deposit and wallet
on:
  push:
    branches:
      - fix-manual-deposit-wallet
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-manual-deposit-wallet
      - name: Apply patch
        run: python tools/fix_manual_deposit_wallet.py
      - name: Check JavaScript
        run: node --check YemenGuide.Web/wwwroot/js/owner/calendar-manager.js
      - name: Check diff
        run: git diff --check
      - name: Remove temporary helper files
        run: |
          rm -f tools/fix_manual_deposit_wallet.py
          rm -f .github/workflows/fix-manual-deposit-wallet.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "إصلاح ظهور العربون والمحفظة في الحجز اليدوي"
          git push origin HEAD:fix-manual-deposit-wallet
