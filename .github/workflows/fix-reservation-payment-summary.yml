name: Fix reservation payment summary

on:
  push:
    branches:
      - fix-reservation-payment-summary

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-reservation-payment-summary
          fetch-depth: 0

      - name: Patch reservation payment summary
        shell: python
        run: |
          from pathlib import Path

          # 1) Shared booking details modal
          view = Path('YemenGuide.Web/Areas/Owner/Views/Reservation/ManageReservations.cshtml')
          text = view.read_text(encoding='utf-8-sig')

          text = text.replace('المتبقي عند المنشأة', 'الباقي للمنشأة')
          text = text.replace('إجمالي المبالغ المحصلة', 'إجمالي المدفوع')
          text = text.replace(
              'نوع الدفع والمبلغ المعتمد والمتبقي وإشعار الحوالة.',
              'إجمالي المدفوع والمحصّل فعليًا والباقي وحالة الدفع.'
          )

          marker = '''                                    <div class="financial-summary-row">\n\n                                        <span>\n                                            الباقي للمنشأة\n                                        </span>\n'''
          collected_row = '''                                    <div class="financial-summary-row"\n                                     id="modalCollectedAtPropertyRow">\n\n                                        <span>\n                                            المحصّل لدى المنشأة\n                                        </span>\n\n                                        <strong class="text-success">\n                                            --\n                                        </strong>\n\n                                    </div>\n\n'''
          if 'id="modalCollectedAtPropertyRow"' not in text:
              if marker not in text:
                  raise SystemExit('ManageReservations marker not found')
              text = text.replace(marker, collected_row + marker, 1)

          view.write_text(text, encoding='utf-8-sig')

          # 2) Modal JavaScript: show actual cumulative payment, hide historical transfer plan after approval
          js = Path('YemenGuide.Web/wwwroot/js/owner/reservation-actions.js')
          text = js.read_text(encoding='utf-8-sig')

          online_block = '''        setText(\n            "modalAmountOnline",\n            details.onlineAmount,\n            "0 ريال يمني"\n        );\n\n'''
          collected_block = '''        setFinancialRow(\n            "modalCollectedAtPropertyRow",\n            details.collectedAmount,\n            "text-success"\n        );\n\n'''
          if '"modalCollectedAtPropertyRow"' not in text:
              if online_block not in text:
                  raise SystemExit('reservation-actions online block not found')
              text = text.replace(online_block, online_block + collected_block, 1)

          payment_type_marker = '''        setFinancialRow(\n            "modalOnlinePaymentTypeRow",\n'''
          flow_block = '''        const showExpectedOnlineFlow =\n            details.bookingState === "AwaitingPayment" ||\n            details.bookingState === "PaymentReview";\n\n        setVisible(\n            "modalOnlinePaymentTypeRow",\n            showExpectedOnlineFlow,\n            "flex"\n        );\n\n        setVisible(\n            "modalExpectedOnlineRow",\n            showExpectedOnlineFlow,\n            "flex"\n        );\n\n        setVisible(\n            "modalExpectedRemainingRow",\n            showExpectedOnlineFlow,\n            "flex"\n        );\n\n'''
          if 'const showExpectedOnlineFlow' not in text:
              if payment_type_marker not in text:
                  raise SystemExit('reservation-actions payment type marker not found')
              text = text.replace(payment_type_marker, flow_block + payment_type_marker, 1)

          old_confirm = '''        setFinancialRow(\n            "modalPaymentConfirmedRow",\n            details.paymentConfirmed\n                ? "تم اعتماد الدفع"\n                : "الدفع غير معتمد",\n\n            details.paymentConfirmed\n                ? "text-success"\n                : "text-warning"\n        );\n'''
          new_confirm = '''        const isFullyPaid =\n            details.paymentStatus === "Paid" ||\n            details.paymentStatus === "FullyPaid";\n\n        setFinancialRow(\n            "modalPaymentConfirmedRow",\n            isFullyPaid\n                ? "مدفوع بالكامل"\n                : details.paymentConfirmed\n                    ? "تم اعتماد الدفع"\n                    : "الدفع غير معتمد",\n\n            details.paymentConfirmed || isFullyPaid\n                ? "text-success"\n                : "text-warning"\n        );\n'''
          if old_confirm in text:
              text = text.replace(old_confirm, new_confirm, 1)
          elif 'const isFullyPaid' not in text:
              raise SystemExit('reservation-actions payment confirmation block not found')

          js.write_text(text, encoding='utf-8-sig')

          # 3) Map the stored online payment type into the owner reservation DTO.
          controller = Path('YemenGuide.Web/Areas/Owner/Controllers/ReservationController.cs')
          text = controller.read_text(encoding='utf-8-sig')
          old = '''                PaymentMethod = booking.PaymentMethod?.Trim(),\n                Quantity = Math.Max(1, booking.Quantity),\n'''
          new = '''                PaymentMethod = booking.PaymentMethod?.Trim(),\n                OnlinePaymentType =\n                    financialRecord?.OnlinePaymentType?.Trim(),\n                Quantity = Math.Max(1, booking.Quantity),\n'''
          if 'financialRecord?.OnlinePaymentType?.Trim()' not in text:
              if old not in text:
                  raise SystemExit('ReservationController payment mapping marker not found')
              text = text.replace(old, new, 1)
          controller.write_text(text, encoding='utf-8-sig')

      - name: Verify JavaScript
        run: node --check YemenGuide.Web/wwwroot/js/owner/reservation-actions.js

      - name: Verify diff
        run: git diff --check

      - name: Build solution
        run: dotnet build YemenGuide.sln --configuration Release --no-restore || dotnet build YemenGuide.sln --configuration Release

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-reservation-payment-summary.yml

      - name: Commit changes
        run: |
          git config user.name "yahya-yemenguide"
          git config user.email "yahyagemini11@gmail.com"
          git add YemenGuide.Web/Areas/Owner/Views/Reservation/ManageReservations.cshtml \
                  YemenGuide.Web/wwwroot/js/owner/reservation-actions.js \
                  YemenGuide.Web/Areas/Owner/Controllers/ReservationController.cs \
                  .github/workflows/fix-reservation-payment-summary.yml
          git commit -m "إصلاح ملخص دفعات الحجز وإظهار المبالغ الفعلية"
          git push origin fix-reservation-payment-summary

      - name: Prepare artifact
        run: |
          mkdir -p export/YemenGuide.Web/Areas/Owner/Views/Reservation
          mkdir -p export/YemenGuide.Web/wwwroot/js/owner
          mkdir -p export/YemenGuide.Web/Areas/Owner/Controllers
          cp YemenGuide.Web/Areas/Owner/Views/Reservation/ManageReservations.cshtml export/YemenGuide.Web/Areas/Owner/Views/Reservation/
          cp YemenGuide.Web/wwwroot/js/owner/reservation-actions.js export/YemenGuide.Web/wwwroot/js/owner/
          cp YemenGuide.Web/Areas/Owner/Controllers/ReservationController.cs export/YemenGuide.Web/Areas/Owner/Controllers/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reservation-payment-summary-fix
          path: export
          retention-days: 30
