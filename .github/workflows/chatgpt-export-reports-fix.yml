          from pathlib import Path
          import re

          def load(path):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              return p, text.replace('\r\n', '\n')

          def save(p, text):
              p.write_text(text, encoding='utf-8-sig', newline='\n')

          def rep(text, old, new, label, expected=1):
              count = text.count(old)
              if count != expected:
                  if new in text:
                      print(f'[already] {label}')
                      return text
                  raise RuntimeError(f'{label}: expected {expected}, found {count}')
              print(f'[ok] {label}')
              return text.replace(old, new)

          def regex_rep(text, pattern, replacement, label):
              matches = list(re.finditer(pattern, text, flags=re.S))
              if len(matches) != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {len(matches)}')
              print(f'[ok] {label}')
              return re.sub(pattern, replacement, text, count=1, flags=re.S)

