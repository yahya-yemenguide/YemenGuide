name: Export started warning step files

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - shell: bash
        run: |
          ROOT="YemenGuide_STARTED_WARNING_STEP_FIX"
          mkdir -p "$ROOT/YemenGuide.Web/Views/Places"
          mkdir -p "$ROOT/YemenGuide.Web/wwwroot/js/customer"
          cp YemenGuide.Web/Views/Places/Details.cshtml "$ROOT/YemenGuide.Web/Views/Places/Details.cshtml"
          cp YemenGuide.Web/wwwroot/js/customer/Details.js "$ROOT/YemenGuide.Web/wwwroot/js/customer/Details.js"
          cat > "$ROOT/اقرأني.txt" <<'TXT'
          إصلاح ظهور تنبيه الفترة التي بدأت
          =================================
          استبدل الملفين بنفس المسارات:
          1) YemenGuide.Web/Views/Places/Details.cshtml
          2) YemenGuide.Web/wwwroot/js/customer/Details.js

          الآن عند اختيار تاريخ اليوم والضغط على "التالي":
          - يتم فحص الفترة فورًا.
          - إذا بدأت وما زالت جارية يظهر كم مضى وكم تبقى.
          - إذا وافق العميل ينتقل للخطوة التالية.
          - إذا انتهت الفترة يمنع المتابعة.
          - لا يتكرر التنبيه مرة ثانية عند الانتقال النهائي إلى Checkout.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: YemenGuide_STARTED_WARNING_STEP_FIX
          path: YemenGuide_STARTED_WARNING_STEP_FIX
          retention-days: 7
