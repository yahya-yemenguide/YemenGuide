name: Fix owner actions and refunds

on:
  push:
    branches:
      - fix-owner-actions-refunds

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-owner-actions-refunds

      - name: Apply patch
        run: python .github/scripts/fix_owner_actions_refunds.py

      - name: Verify diff
        run: git diff --check

      - name: Build solution
        run: dotnet build YemenGuide.sln --configuration Release

      - name: Remove temporary helper files
        shell: pwsh
        run: |
          Remove-Item .github/workflows/fix-owner-actions-refunds.yml
          Remove-Item .github/scripts/fix_owner_actions_refunds.py

      - name: Commit verified changes
        shell: pwsh
        run: |
          git config user.name "yahya-yemenguide"
          git config user.email "yahyagemini11@gmail.com"
          git add -A
          git commit -m "تفعيل إجراءات بداية الحجز وتصحيح الاستردادات"
          git push origin fix-owner-actions-refunds

      - name: Prepare files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/YemenGuide.Web/Areas/Owner/Controllers | Out-Null
          New-Item -ItemType Directory -Force artifact/YemenGuide.Web/Areas/Owner/Views/Reservation | Out-Null
          New-Item -ItemType Directory -Force artifact/YemenGuide.Web/Controllers | Out-Null
          Copy-Item YemenGuide.Web/Areas/Owner/Controllers/ReservationController.cs artifact/YemenGuide.Web/Areas/Owner/Controllers/
          Copy-Item YemenGuide.Web/Areas/Owner/Views/Reservation/_ActiveReservations.cshtml artifact/YemenGuide.Web/Areas/Owner/Views/Reservation/
          Copy-Item YemenGuide.Web/Areas/Owner/Views/Reservation/ManageReservations.cshtml artifact/YemenGuide.Web/Areas/Owner/Views/Reservation/
          Copy-Item YemenGuide.Web/Controllers/BookingsController.cs artifact/YemenGuide.Web/Controllers/

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: owner-actions-refunds-fix
          path: artifact
