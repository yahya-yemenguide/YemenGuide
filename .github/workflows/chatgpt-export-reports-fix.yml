name: Export actual report fix files

on:
  push:
    branches:
      - chatgpt-export-reports-fix-20260913

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply fixes and prepare actual files
        run: python3 tools/chatgpt_export_reports.py

      - name: Upload actual files
        uses: actions/upload-artifact@v4
        with:
          name: YemenGuide_Reports_Actual_Files
          path: export
          if-no-files-found: error
          retention-days: 3
