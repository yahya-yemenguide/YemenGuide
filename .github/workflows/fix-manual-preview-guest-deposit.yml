name: Fix manual preview guest deposit
on:
  push:
    branches: [fix-manual-preview-guest-deposit]
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-manual-preview-guest-deposit
          fetch-depth: 0
      - name: Patch calendar JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('YemenGuide.Web/wwwroot/js/owner/calendar-manager.js')
          t=p.read_text(encoding='utf-8-sig')
          old='''            if (manualStep === 2) {\n                const pricingPreview = await previewManualBooking(true);\n                if (!pricingPreview) return;\n            }'''
          new='''            if (manualStep === 2) {\n                const pricingPreview = await previewManualPricingForPaymentStep(true);\n                if (!pricingPreview) return;\n            }'''
          if old not in t: raise SystemExit('step block not found')
          t=t.replace(old,new,1)
          marker='''        async function previewManualBooking(showErrors) {\n'''
          insert='''        async function previewManualPricingForPaymentStep(showErrors) {\n            const request = buildManualRequest();\n            const validation = validateManualRequest(request, showErrors);\n            if (validation) return null;\n\n            const pricingRequest = {\n                ...request,\n                paymentMode: "Collected",\n                paidAmount: 0,\n                paymentMethod: "Cash",\n                ownerWalletId: null,\n                paymentReferenceNumber: null\n            };\n\n            setButtonLoading(elements.preview, true, "نحسب العربون…");\n            try {\n                const result = await postJson(ENDPOINTS.preview, pricingRequest);\n                if (!result.success || !result.data) throw new Error(result.message || "تعذر حساب السعر والعربون.");\n                latestManualQuote = result.data;\n                return result.data;\n            } catch (error) {\n                latestManualQuote = null;\n                if (showErrors) applyManualServerError(error?.message || "تعذر حساب السعر والعربون.");\n                return null;\n            } finally {\n                setButtonLoading(elements.preview, false, "فحص السعر والتوفر");\n            }\n        }\n\n'''
          if marker not in t: raise SystemExit('preview marker not found')
          t=t.replace(marker,insert+marker,1)
          p.write_text(t,encoding='utf-8-sig')
          PY
      - name: Verify JS
        run: |
          node --check YemenGuide.Web/wwwroot/js/owner/calendar-manager.js
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/fix-manual-preview-guest-deposit.yml
          git config user.name "yahya-yemenguide"
          git config user.email "yahyagemini11@gmail.com"
          git add YemenGuide.Web/wwwroot/js/owner/calendar-manager.js .github/workflows/fix-manual-preview-guest-deposit.yml
          git commit -m "Fix guest pricing preview before manual payment"
          git push origin HEAD:fix-manual-preview-guest-deposit
