name: Run immediate started warning patch

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - run: python3 .github/scripts/fix_started_warning_on_date_select.py
      - run: git diff --check
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YemenGuide.Web/wwwroot/js/customer/Details.js
          git commit -m "Show started-period warning immediately after date selection"
          git push origin HEAD:master
